<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Connect Four</title>
  <meta name="description" content="Play Connect Four against 6 AI levels, a friend over a shared link, or your own Claude via MCP. Leaderboards included." />
  <meta name="theme-color" content="#0b1020" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta property="og:title" content="Connect Four" />
  <meta property="og:description" content="Four in a row. Play the AI, a friend, or Claude." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <script>
    // apply saved theme before paint
    try { const t = localStorage.getItem("c4.theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand" data-link>
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span>Connect<b>Four</b></span>
    </a>
    <nav class="nav">
      <a href="/play" data-link>Play</a>
      <a href="/leaderboard" data-link>Leaderboard</a>
      <a href="/claude" data-link>Claude</a>
    </nav>
    <div class="top-actions">
      <button class="icon-btn" id="sound-btn" title="Sound on/off" aria-label="Toggle sound"></button>
      <button class="icon-btn" id="theme-btn" title="Light / dark" aria-label="Toggle theme"></button>
      <button class="chip" id="account-btn"></button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="/" data-link><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="/play" data-link><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><circle cx="8" cy="16" r="3"/><circle cx="16" cy="16" r="3"/></svg>Play</a>
    <a href="/leaderboard" data-link><svg viewBox="0 0 24 24"><path d="M4 20V10h4v10zm6 0V4h4v16zm6 0v-7h4v7z"/></svg>Ranks</a>
    <a href="/claude" data-link><svg viewBox="0 0 24 24"><path d="M12 2 14 9l7 3-7 3-2 7-2-7-7-3 7-3z"/></svg>Claude</a>
  </nav>

  <div id="tooltip" role="tooltip" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <dialog id="auth-dialog"></dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
